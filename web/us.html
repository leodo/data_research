<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>暗盘行情 · 美股与商品 · 投研工作台</title>
<link rel="icon" href="data:," />
<script src="../vendor/echarts.min.js"></script>
<script src="app.js"></script>
<link rel="stylesheet" href="app.css" />
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink);font-size:14px;-webkit-font-smoothing:antialiased}
a{text-decoration:none;color:inherit}
.layout{display:flex;min-height:100vh}
.sidebar{width:208px;flex:0 0 208px;background:var(--bg-sidebar);border-right:1px solid var(--line);padding:18px 12px;position:sticky;top:0;height:100vh;overflow:auto}
.logo{display:flex;align-items:center;gap:9px;font-weight:800;font-size:17px;padding:2px 8px 20px}
.logo .mark{width:26px;height:26px;border-radius:8px;background:var(--mark-grad);display:grid;place-items:center;color:#fff;font-size:13px}
.nav-group{margin-bottom:16px}
.nav-title{font-size:11px;color:var(--text-3);padding:6px 10px;letter-spacing:.5px}
.nav-item{display:flex;align-items:center;gap:9px;padding:9px 10px;border-radius:8px;color:var(--text-2);cursor:pointer;font-size:13px}
.nav-item:hover{background:var(--nav-hover)}
.nav-item.active{background:var(--brand-soft);color:var(--brand-deep);font-weight:600}
.nav-item .ico{width:16px;text-align:center;font-size:14px}
.main{flex:1;min-width:0}
.topbar{height:56px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 26px;background:var(--bg);position:sticky;top:0;z-index:20}
.topbar .crumb{color:var(--text-3);font-size:13px;display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.topbar .crumb b{color:var(--ink)}
.topbar .right{display:flex;align-items:center;gap:14px;color:var(--text-2);font-size:12px}
.theme-toggle{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--bg-soft);color:var(--text-2);border-radius:999px;padding:6px 12px;font-size:12px;cursor:pointer;transition:.18s;white-space:nowrap}
.theme-toggle:hover{border-color:var(--brand);color:var(--brand)}
.theme-toggle .tt-ico{font-size:14px;line-height:1}
.wrap{max-width:1440px;margin:0 auto;padding:22px 26px 60px}
.subnav{display:flex;gap:6px;border-bottom:1px solid var(--line);margin-bottom:18px;flex-wrap:wrap}
.subnav button{border:0;background:none;padding:10px 14px;font-size:14px;color:var(--text-2);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
.subnav button.active{color:var(--brand);font-weight:700;border-bottom-color:var(--brand)}
.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin:4px 0 16px}
.page-head h1{font-size:27px;font-weight:800;margin:0;letter-spacing:-.5px}
.page-head h1 span{font-size:12.5px;font-weight:400;color:var(--text-3);margin-left:10px}
.page-sub{color:var(--text-3);font-size:12px;line-height:1.7;text-align:right}
.kpi-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--bg-card);border:1px solid var(--line);border-radius:10px;padding:13px 15px;box-shadow:var(--shadow)}
.kpi .k{font-size:11.5px;color:var(--text-3);display:flex;justify-content:space-between;gap:8px}
.kpi .v{font-size:25px;font-weight:800;line-height:1.2;margin-top:5px;font-variant-numeric:tabular-nums;letter-spacing:-.5px}
.kpi .v small{font-size:12px;font-weight:700;margin-left:5px;letter-spacing:0}
.kpi .s{font-size:11px;color:var(--text-3);margin-top:5px;line-height:1.5}
.kpi .s b{color:var(--text-2);font-weight:700}
.insight{display:flex;gap:10px;align-items:flex-start;background:var(--brand-soft);border:1px solid var(--brand);border-left:4px solid var(--brand);border-radius:8px;padding:11px 14px;margin-bottom:18px;font-size:12.5px;line-height:1.75;color:var(--text-2)}
.insight b{color:var(--brand-deep);white-space:nowrap}
.card{background:var(--bg-card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px 20px;margin-bottom:18px}
.sec-head{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;flex-wrap:wrap;margin-bottom:8px}
.sec-title{font-size:16px;font-weight:800;color:var(--ink);padding-left:10px;border-left:4px solid var(--brand)}
.sec-sub{font-size:11.5px;color:var(--text-3);margin-top:4px;padding-left:14px;line-height:1.5}
.sec-right{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.chart{width:100%;height:360px}
.chart.sm{height:300px}
.side-chart{height:286px}
.grid2{display:grid;grid-template-columns:1.05fr 1fr;gap:18px}
.grid2 > *{min-width:0}
.grid2 .card{margin-bottom:18px}
/* 表格 + 选中标的：左侧 8 列行情，右侧 24h K 线与买卖盘 */
.trade-layout{display:grid;grid-template-columns:minmax(0,1.72fr) minmax(340px,1fr);gap:18px;align-items:start}
.trade-layout > .card{margin-bottom:18px}
.side-card{padding:16px 18px}
.sq-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:2px 0 0}
.sq-price{font-size:30px;font-weight:800;letter-spacing:-.9px;font-variant-numeric:tabular-nums;line-height:1.15}
.sq-price small{font-size:13.5px;font-weight:700;margin-left:7px;letter-spacing:0}
.sq-sub{font-size:11px;color:var(--text-3);margin:3px 0 10px;font-variant-numeric:tabular-nums}
.sq-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin-bottom:10px}
.sq-item{background:var(--bg-soft);border:1px solid var(--line);border-radius:8px;padding:7px 9px}
.sq-item .k{font-size:10px;color:var(--text-3)}
.sq-item .v{font-size:15px;font-weight:800;margin-top:2px;font-variant-numeric:tabular-nums;letter-spacing:-.3px}
.sq-item .s{font-size:10px;color:var(--text-3);margin-top:1px}
.side-meta{display:flex;flex-wrap:wrap;gap:5px 12px;font-size:10.5px;color:var(--text-3);margin-top:8px;padding-top:8px;border-top:1px dashed var(--line);line-height:1.6}
.side-meta b{color:var(--text-2);font-weight:700}
.book-grid{margin-bottom:0}
.note{font-size:11.5px;color:var(--text-3);line-height:1.7;margin-top:8px;padding-top:8px;border-top:1px dashed var(--line)}
.note b{color:var(--text-2)}
.up{color:var(--up)!important}
.down{color:var(--down)!important}
.flat{color:var(--text-3)!important}
.mono{font-variant-numeric:tabular-nums}
.live-badge{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;border-radius:999px;padding:2px 9px;background:var(--pos-bg);color:var(--pos);white-space:nowrap}
.live-badge i{width:6px;height:6px;border-radius:50%;background:currentColor;display:inline-block;animation:livePulse 2s infinite}
.live-badge.paused{background:var(--bg-soft);color:var(--text-3)}
.live-badge.paused i{animation:none}
.live-badge.err{background:var(--cau-bg);color:var(--cau)}
.live-badge.err i{animation:none}
@keyframes livePulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.8)}}
.clock-tag{font-size:11px;color:var(--text-3);font-variant-numeric:tabular-nums}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:10px 0}
.toolbar input{border:1px solid var(--line);background:var(--bg-soft);color:var(--ink);border-radius:7px;padding:6px 9px;font-size:12px;outline:none;font-family:inherit;width:200px}
.toolbar input:focus{border-color:var(--brand);box-shadow:0 0 0 2px var(--brand-soft)}
.toolbar .seg{display:flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}
.toolbar .seg button{border:0;background:var(--bg-card);color:var(--text-2);padding:6px 10px;font-size:11.5px;cursor:pointer}
.toolbar .seg button + button{border-left:1px solid var(--line)}
.toolbar .seg button.on{background:var(--brand-soft);color:var(--brand-deep);font-weight:700}
.toolbar .spacer{flex:1}
.toolbar .cnt{font-size:11.5px;color:var(--text-3);white-space:nowrap}
.refresh-ring{display:inline-flex;align-items:center;gap:6px;font-size:11px;color:var(--text-3);font-variant-numeric:tabular-nums}
.refresh-ring b{color:var(--text-2)}
.tbl-wrap{overflow:auto;border:1px solid var(--line);border-radius:8px;max-height:660px}
.tbl{width:100%;border-collapse:collapse;font-size:12px;white-space:nowrap}
.tbl th,.tbl td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:right;font-variant-numeric:tabular-nums}
.tbl th{position:sticky;top:0;z-index:2;background:var(--bg-soft);color:var(--text-3);font-weight:600;font-size:11px;cursor:default}
.tbl th.sortable{cursor:pointer;user-select:none}
.tbl th.sortable:hover{color:var(--brand)}
.tbl th.on{color:var(--brand);font-weight:800}
.tbl th.on[data-dir="1"]::after{content:" ↑"}
.tbl th.on[data-dir="-1"]::after{content:" ↓"}
.tbl th:first-child,.tbl td:first-child{text-align:left;position:sticky;left:0;background:var(--bg-card);z-index:1}
.tbl th:first-child{background:var(--bg-soft);z-index:3}
.tbl td{color:var(--text-2)}
.tbl tbody tr{cursor:pointer}
.tbl tbody tr:hover td{background:var(--bg-soft)}
.tbl tbody tr.sel td{background:var(--brand-soft)}
.tbl tbody tr.sel td:first-child{box-shadow:inset 3px 0 0 var(--brand)}
.tbl tbody tr:last-child td{border-bottom:0}
.c-name{display:flex;flex-direction:column;gap:1px;min-width:120px}
.c-name b{color:var(--ink);font-weight:800;font-size:13.5px;letter-spacing:-.2px;line-height:1.35}
.c-name span{font-size:10px;color:var(--text-3);font-weight:600;letter-spacing:.3px}
.c-time{display:flex;flex-direction:column;gap:1px;line-height:1.35}
.c-time b{font-weight:600;color:var(--text-2);font-size:11px}
.c-time span{font-size:10px;color:var(--text-3)}
.spark-cell{text-align:right;padding-top:4px;padding-bottom:4px}
.spark{display:block;width:88px;height:26px;margin-left:auto}
.spark-empty{color:var(--text-3);font-size:11px}
.badge{display:inline-block;padding:1px 7px;border-radius:999px;font-size:10px;font-weight:700;line-height:1.6;white-space:nowrap}
.badge.green{color:var(--pos);background:var(--pos-bg)}
.badge.blue{color:var(--neu);background:var(--neu-bg)}
.badge.gray{color:var(--text-3);background:var(--bg-soft)}
.badge.orange{color:var(--brand-deep);background:var(--brand-soft)}
.badge.red{color:var(--cau);background:var(--cau-bg)}
.flash-up{animation:flashUp .9s ease-out}
.flash-down{animation:flashDown .9s ease-out}
@keyframes flashUp{0%{background:var(--up);color:#fff}100%{background:transparent}}
@keyframes flashDown{0%{background:var(--down);color:#fff}100%{background:transparent}}
.big-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:6px 0 12px}
.bq{background:var(--bg-soft);border:1px solid var(--line);border-radius:9px;padding:10px 12px}
.bq .k{font-size:10.5px;color:var(--text-3);display:flex;justify-content:space-between;gap:6px}
.bq .v{font-size:21px;font-weight:800;margin-top:3px;font-variant-numeric:tabular-nums;letter-spacing:-.4px}
.bq .v small{font-size:11px;font-weight:700;margin-left:4px}
.bq .s{font-size:10px;color:var(--text-3);margin-top:3px;line-height:1.45;font-variant-numeric:tabular-nums}
.detail-meta{display:flex;gap:14px;flex-wrap:wrap;font-size:11px;color:var(--text-3);margin:2px 0 10px}
.detail-meta b{color:var(--text-2);font-weight:700}
.depth{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:4px}
.depth h4{margin:0 0 6px;font-size:11px;color:var(--text-3);font-weight:600;display:flex;justify-content:space-between}
.depth h4 span{font-weight:400}
.depth-col{font-size:11px;font-variant-numeric:tabular-nums}
.depth-row{position:relative;display:grid;grid-template-columns:1fr 76px;gap:8px;padding:2px 5px;border-radius:3px;overflow:hidden}
.depth-row .bar{position:absolute;top:0;bottom:0;right:0;opacity:.16;border-radius:3px}
.depth-row .p{position:relative;z-index:1;font-weight:600}
.depth-row .s{position:relative;z-index:1;text-align:right;color:var(--text-3)}
.depth-ask .p{color:var(--down)}
.depth-bid .p{color:var(--up)}
.depth-row .bar.ask{background:var(--down)}
.depth-row .bar.bid{background:var(--up)}
.tape-wrap{max-height:236px;overflow:auto;margin-top:12px;border-top:1px dashed var(--line);padding-top:8px}
.tape{width:100%;border-collapse:collapse;font-size:11px;font-variant-numeric:tabular-nums}
.tape th{position:sticky;top:0;background:var(--bg-card);color:var(--text-3);font-weight:600;text-align:right;padding:3px 6px;font-size:10px}
.tape th:first-child,.tape td:first-child{text-align:left}
.tape td{padding:3px 6px;text-align:right;color:var(--text-2);border-bottom:1px solid var(--line)}
.tape tr:last-child td{border-bottom:0}
.seg-btns{display:flex;gap:4px;flex-wrap:wrap}
.seg-btns button{border:1px solid var(--line);background:var(--bg-soft);color:var(--text-2);border-radius:6px;padding:3px 9px;font-size:11px;cursor:pointer}
.seg-btns button.on{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:700}
.foot{color:var(--text-3);font-size:11.5px;line-height:1.9;margin-top:26px;padding-top:14px;border-top:1px solid var(--line)}
.foot b{color:var(--text-2)}
.loading{padding:60px;text-align:center;color:var(--text-3);line-height:1.9}
.err{padding:26px;border:1px solid var(--cau);background:var(--cau-bg);color:var(--cau);border-radius:10px;font-size:13px;line-height:1.9}
.err code{background:var(--bg-card);border:1px solid var(--line);border-radius:4px;padding:1px 5px;color:var(--ink);font-size:12px}
.skel{height:12px;border-radius:4px;background:linear-gradient(90deg,var(--bg-soft),var(--line),var(--bg-soft));background-size:200% 100%;animation:skel 1.2s infinite}
@keyframes skel{0%{background-position:200% 0}100%{background-position:-200% 0}}
.pause-box{display:flex;align-items:center;gap:8px;background:var(--bg-soft);border:1px dashed var(--line);border-radius:8px;padding:10px 14px;font-size:12px;color:var(--text-3);margin-bottom:16px}
.pause-box b{color:var(--text-2)}
@media(max-width:1480px){.trade-layout{grid-template-columns:1fr}}
@media(max-width:1100px){.kpi-grid{grid-template-columns:repeat(3,minmax(0,1fr))}.grid2{grid-template-columns:1fr}.big-grid{grid-template-columns:repeat(2,1fr)}.page-head{flex-direction:column;align-items:flex-start}.page-sub{text-align:left}}
@media(max-width:820px){.sidebar{display:none}.wrap{padding:14px}.kpi .v{font-size:21px}.chart{height:300px}.topbar{padding:0 14px}.topbar .right>span{display:none}.depth{grid-template-columns:1fr}}
@media(max-width:600px){.kpi-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.tbl th,.tbl td{padding:6px 5px;font-size:11px}.toolbar input{width:100%}}
</style>
</head>
<body>
<div class="layout">
  <aside class="sidebar">
    <div class="logo"><span class="mark">韭</span> 投研工作台</div>
    <div class="nav-group">
      <div class="nav-title">工作台</div>
      <a class="nav-item" href="index.html"><span class="ico">◈</span> 首页</a>

    </div>
    <div class="nav-group">
      <div class="nav-title">市场数据</div>
      <a class="nav-item active" href="us.html"><span class="ico">◭</span> 暗盘行情</a>
      <a class="nav-item" href="cb.html"><span class="ico">◎</span> 可转债</a>
      <div class="toc-side" id="tocSide"></div>
    </div>
  </aside>

  <div class="main">
    <div class="topbar">
      <div class="crumb">市场数据 / <b>暗盘行情</b><span class="live-badge paused" id="liveBadge"><i></i><span id="liveText">正在连接</span></span></div>
      <div class="right"><span>Hyperliquid HIP-3</span><span>24 小时 · 5 秒刷新</span><button class="theme-toggle" id="themeToggle" title="切换主题"><span class="tt-ico">◐</span><span class="tt-label">暗色</span></button></div>
    </div>
    <div class="wrap">
      <div class="subnav">
        <a href="index.html"><button>首页</button></a>
        <a href="indicators.html"><button>恐贪指数</button></a>

  </div>
</div>
<script src="us.js"></script>

</html>
